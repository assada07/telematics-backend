version: '3.8'

services:
  # 📡 EMQX MQTT Broker ตัวเดียวกับในเครื่องพี่
  emqx:
    image: emqx/emqx:latest
    container_name: emqx
    ports:
      - "1883:1883"
      - "18083:18083" # Dashboard สำหรับเพื่อนเช็ก IoT

  # 🗄️ TimescaleDB เวอร์ชัน PostgreSQL 16 ตรงตามที่เครื่องพี่ใช้
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: timescaledb
    ports:
      - "5434:5432" # รีแมพพอร์ตตรงตาม .env
    environment:
      - POSTGRES_USER=fleet_user
      - POSTGRES_PASSWORD=fleet_pass
      - POSTGRES_DB=fleet_db
    volumes:
      - ts_data:/var/lib/postgresql/data

volumes:
  ts_data: