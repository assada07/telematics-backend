name: Deploy Local
on:
  workflow_run:
    workflows: ["CI Pipeline"]
    branches: [main, develop]
    types:
      - completed
jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted
    env:
      # ใช้ config directory แยกของ CI เอง ไม่ใช้ ~/.docker ตัว default
      # ที่ Docker Desktop คอยจัดการ/เขียนทับ credsStore กลับเป็น "desktop" อยู่เรื่อยๆ
      DOCKER_CONFIG:            ${{ github.workspace }}/.docker-ci
      POSTGRES_DB:              ${{ secrets.POSTGRES_DB }}
      POSTGRES_USER:            ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD:        ${{ secrets.POSTGRES_PASSWORD }}
      ODOO_DB_USER:             ${{ secrets.ODOO_DB_USER }}
      ODOO_DB_PASSWORD:         ${{ secrets.ODOO_DB_PASSWORD }}
      ODOO_DB_NAME:             ${{ secrets.ODOO_DB_NAME }}
      ODOO_ADMIN_USER:          ${{ secrets.ODOO_ADMIN_USER }}
      ODOO_ADMIN_PASSWORD:      ${{ secrets.ODOO_ADMIN_PASSWORD }}
      EMQX_DASHBOARD_PASSWORD:  ${{ secrets.EMQX_DASHBOARD_PASSWORD }}
      SECRET_KEY:               ${{ secrets.SECRET_KEY }}
      HMAC_SECRET:              ${{ secrets.HMAC_SECRET }}
    steps:
      - uses: actions/checkout@v4

      # แก้ปัญหา: self-hosted macOS runner ใช้ macOS Keychain เป็น Docker credential store (credsStore: "desktop")
      # การแก้ ~/.docker/config.json ตรงๆ ไม่พอ เพราะ Docker Desktop ที่รันอยู่เบื้องหลังจะเขียนทับค่ากลับไปเป็น
      # "desktop" อีกครั้ง จึงต้องชี้ DOCKER_CONFIG (ตั้งไว้ที่ job env ด้านบน) ไปที่โฟลเดอร์แยกที่ Desktop ไม่รู้จัก/ไม่ยุ่งด้วย
      - name: Fix Docker credential store on self-hosted macOS runner
        run: |
          mkdir -p "$DOCKER_CONFIG"
          echo '{}' > "$DOCKER_CONFIG/config.json"
          # สำคัญ: ปลั๊กอิน "compose" ถูกค้นหาใน $DOCKER_CONFIG/cli-plugins ไม่ใช่แค่ ~/.docker
          # ต้อง symlink โฟลเดอร์เดิมเข้ามา ไม่งั้น "docker compose" จะหา compose ไม่เจอ
          # และ error ออกมาเป็น "unknown shorthand flag: 'f'" แทน
          if [ -d "$HOME/.docker/cli-plugins" ]; then
            ln -sf "$HOME/.docker/cli-plugins" "$DOCKER_CONFIG/cli-plugins"
          fi

      # ตรวจสอบทันทีว่าแก้ได้จริงก่อนจะไปรัน compose build (ล้มเร็ว เห็น error ชัดเจนถ้ายังไม่ผ่าน)
      - name: Verify anonymous pull works
        run: docker pull python:3.11-slim

      - name: Verify docker compose plugin is discoverable
        run: docker compose version

      # สร้าง .env สำหรับ docker compose (root)
      - name: Create Global .env File
        run: |
          echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" > .env
          echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> .env
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
          echo "EMQX_DASHBOARD_PASSWORD=${{ secrets.EMQX_DASHBOARD_PASSWORD }}" >> .env
          echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> .env
          echo "ODOO_DB_NAME=${{ secrets.ODOO_DB_NAME }}" >> .env
          echo "ODOO_ADMIN_USER=${{ secrets.ODOO_ADMIN_USER }}" >> .env
          echo "ODOO_ADMIN_PASSWORD=${{ secrets.ODOO_ADMIN_PASSWORD }}" >> .env

      # สร้าง .env สำหรับ fleet-backend app (ใช้ชื่อ service ใน Docker)
      - name: Create Fleet Backend .env File
        run: |
          echo "DB_HOST=timescaledb" > fleet-backend/.env
          echo "DB_PORT=5432" >> fleet-backend/.env
          echo "DB_NAME=${{ secrets.POSTGRES_DB }}" >> fleet-backend/.env
          echo "DB_USER=${{ secrets.POSTGRES_USER }}" >> fleet-backend/.env
          echo "DB_PASS=${{ secrets.POSTGRES_PASSWORD }}" >> fleet-backend/.env
          echo "MQTT_HOST=emqx" >> fleet-backend/.env
          echo "MQTT_PORT=1883" >> fleet-backend/.env
          echo "MQTT_TOPIC=#" >> fleet-backend/.env
          echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> fleet-backend/.env
          echo "HMAC_SECRET=${{ secrets.HMAC_SECRET }}" >> fleet-backend/.env

      # สร้าง networks และ volumes ถ้ายังไม่มี
      - name: Create Docker networks and volumes
        run: |
          docker network create backend-net || true
          docker network create odoo-net || true
          docker volume create emqx-data || true
          docker volume create emqx-log || true
          docker volume create timescaledb-data || true
          docker volume create timescaledb-log || true
          docker volume create redis-data || true
          docker volume create backend-log || true

      # เคลียร์ BuildKit cache ก่อน build ทุกครั้ง กัน snapshot ค้าง/เพี้ยนจากรอบก่อน
      # (โดยเฉพาะช่วงที่ยังมี cd.yml วิ่งชนกับ deploy-local.yml บนเครื่องเดียวกัน)
      - name: Prune Docker build cache before building
        run: docker builder prune -af

      # Deploy — down ก่อนแล้ว up ใหม่ (ไม่ลบ volumes เพื่อรักษาข้อมูล)
      # หมายเหตุ: เขียนคำสั่งจบในบรรทัดเดียว (ไม่ใช้ \ ต่อบรรทัด) เพื่อกัน CRLF ทำให้ continuation พังแบบที่เจอมาก่อน
      - name: Deploy Infrastructure and Backend
        run: |
          docker compose -f docker-compose.yml -f docker-compose.backend.yml down --remove-orphans
          docker compose -f docker-compose.yml -f docker-compose.backend.yml up -d --build --remove-orphans
